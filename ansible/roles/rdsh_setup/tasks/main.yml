---
- name: Install RD Session Host role
  win_feature:
    name: RDS-RD-Server
    include_management_tools: true
    state: present
  register: rdsh_install

- name: Reboot after RDSH role install
  ansible.windows.win_reboot:
    reboot_timeout: 600
  when: rdsh_install.reboot_required

- name: Install RSAT AD tools
  win_feature:
    name:
      - RSAT-AD-Tools
      - RSAT-AD-PowerShell
    include_management_tools: true
    state: present
  register: rsat_install

- name: Reboot after RSAT install
  ansible.windows.win_reboot:
    reboot_timeout: 600
  when: rsat_install.reboot_required

- name: Verify RDSH role is active
  win_shell: |
    (Get-WindowsFeature RDS-RD-Server).InstallState
  register: rdsh_state
  changed_when: false
  failed_when: rdsh_state.stdout.strip() != 'Installed'

- name: Set timezone
  win_timezone:
    timezone: "{{ 'Pacific Standard Time' if aws_region == 'us-west-2' else 'Eastern Standard Time' }}"

# --- winget applications ---
# Each entry: id = winget package ID, name = display name for task output.
# Idempotent: winget exits 0 on already-installed packages (exit code -1978335189
# is treated as already installed by the failed_when guard).
- name: Install applications via winget
  win_shell: |
    winget install --id {{ item.id }} --exact --silent `
      --accept-package-agreements --accept-source-agreements
  loop:
    - { id: "Microsoft.PowerShell",              name: "PowerShell 7" }
    - { id: "Microsoft.WindowsTerminal",          name: "Windows Terminal" }
    - { id: "JanDeDobbeleer.OhMyPosh",            name: "Oh My Posh" }
    - { id: "Git.Git",                            name: "Git" }
    - { id: "Notepad++.Notepad++",                name: "Notepad++" }
    - { id: "WinSCP.WinSCP",                      name: "WinSCP" }
    - { id: "PuTTY.PuTTY",                        name: "PuTTY" }
    - { id: "Microsoft.Sysinternals.Suite",       name: "Sysinternals Suite" }
    - { id: "WiresharkFoundation.Wireshark",      name: "Wireshark" }
    - { id: "VanDyke.SecureCRT",                  name: "SecureCRT" }
    - { id: "Nmap.Nmap",                          name: "Nmap" }
  loop_control:
    label: "{{ item.name }}"
  register: winget_result
  changed_when: "'Successfully installed' in winget_result.stdout"
  # winget exit code -1978335189 (0x8A150021) = already installed — treat as ok
  failed_when: winget_result.rc != 0 and winget_result.rc != -1978335189

# --- PowerShell 7 post-install configuration ---

- name: Set PowerShell 7 as default SSH shell
  win_regedit:
    path: HKLM:\SOFTWARE\OpenSSH
    name: DefaultShell
    data: 'C:\Program Files\PowerShell\7\pwsh.exe'
    type: string
    state: present

- name: Configure Oh My Posh in PowerShell 7 profile (all users)
  win_shell: |
    $profileDir = "C:\Program Files\PowerShell\7"
    $profilePath = "$profileDir\profile.ps1"
    $ompLine = 'oh-my-posh init pwsh --config "$env:POSH_THEMES_PATH\jandedobbeleer.omp.json" | Invoke-Expression'
    if (-not (Test-Path $profilePath) -or (Get-Content $profilePath -Raw) -notmatch 'oh-my-posh') {
        Add-Content -Path $profilePath -Value $ompLine
    }
  changed_when: true

# Seed Windows Terminal settings into the Default user profile so every new
# user login inherits PS7 as the default shell. WT's auto-detected PS7 profile
# always uses the stable GUID {574e775e-4f2a-5b96-ac1e-a2962a402336}.
- name: Create Windows Terminal LocalState dir in Default user profile
  win_file:
    path: 'C:\Users\Default\AppData\Local\Packages\Microsoft.WindowsTerminal_8wekyb3d8bbwe\LocalState'
    state: directory

- name: Write Windows Terminal settings to Default user profile
  win_copy:
    dest: 'C:\Users\Default\AppData\Local\Packages\Microsoft.WindowsTerminal_8wekyb3d8bbwe\LocalState\settings.json'
    content: |
      {
          "defaultProfile": "{574e775e-4f2a-5b96-ac1e-a2962a402336}",
          "profiles": {
              "defaults": {}
          },
          "schemes": []
      }
