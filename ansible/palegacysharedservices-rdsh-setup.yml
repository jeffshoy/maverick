---
# Playbook: PALegacySharedServices RDSH post-deploy setup
#
# Installs the RD Session Host Windows role and configures all three
# INF-WSRDS* servers via AWS SSM Session Manager — no WinRM or Windows
# credentials required. Authentication is IAM-based using the pipeline
# runner's assumed role (cst-role-prd-deployment) and the instance's
# IAM profile (inf-palegacysharedservices-ec2-profile).
#
# Commands run as SYSTEM on the target via the SSM agent. Large command
# output is staged to s3://cst-comm-palegacysharedservices-media/ansible-staging/
#
# Usage:
#   ansible-playbook palegacysharedservices-rdsh-setup.yml \
#     -e "aws_region=us-east-1"
#
# Targets all instances tagged cst_application=inf-admin-rdsh in the
# specified region via the aws_ec2 dynamic inventory.

- name: Configure RDSH terminal servers
  gather_facts: true
  hosts: "tag_cst_application_inf_admin_rdsh:&region_{{ aws_region | replace('-', '_') }}"
  vars:
    ansible_aws_ssm_instance_id: "{{ instance_id }}"
    ansible_aws_ssm_region: "{{ aws_region | default('us-east-1') }}"
    aws_region: "{{ aws_region | default('us-east-1') }}"
  vars_files:
    - vars/winrm_connection.yml
  tasks:
    - name: Include RDSH setup role
      include_role:
        name: rdsh_setup
        apply:
          tags: always
      tags: always
