---
# Connection settings for Windows hosts via AWS SSM Session Manager.
# Authentication is IAM-based — no Windows credentials required.
# The pipeline runner role (cst-role-prd-deployment) calls ssm:StartSession;
# commands run as SYSTEM via the SSM agent on the target instance.
ansible_connection: community.aws.aws_ssm
ansible_shell_type: powershell
ansible_aws_ssm_bucket_name: cst-comm-palegacysharedservices-media
ansible_aws_ssm_s3_addressing_style: path
ansible_aws_ssm_s3_key_prefix: ansible-staging
