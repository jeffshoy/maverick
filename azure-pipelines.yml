trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  TF_VERSION: "1.7.0"
  TF_ENV: dev

stages:
  - stage: Plan
    displayName: "Terraform Plan"
    jobs:
      - job: Plan
        displayName: "Init, Validate & Plan"
        steps:
          - task: TerraformInstaller@1
            displayName: "Install Terraform $(TF_VERSION)"
            inputs:
              terraformVersion: $(TF_VERSION)

          - task: TerraformTaskV4@4
            displayName: "Terraform Init"
            inputs:
              provider: azurerm
              command: init
              backendServiceArm: "Azure-Service-Connection"
              backendAzureRmResourceGroupName: $(TF_BACKEND_RG)
              backendAzureRmStorageAccountName: $(TF_BACKEND_STORAGE)
              backendAzureRmContainerName: tfstate
              backendAzureRmKey: "$(TF_ENV).terraform.tfstate"

          - task: TerraformTaskV4@4
            displayName: "Terraform Validate"
            inputs:
              provider: azurerm
              command: validate

          - task: TerraformTaskV4@4
            displayName: "Terraform Plan"
            inputs:
              provider: azurerm
              command: plan
              environmentServiceNameAzureRM: "Azure-Service-Connection"
              commandOptions: "-var-file=$(TF_ENV).tfvars"

  - stage: Apply
    displayName: "Terraform Apply"
    dependsOn: Plan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: Apply
        displayName: "Apply to $(TF_ENV)"
        environment: $(TF_ENV)
        strategy:
          runOnce:
            deploy:
              steps:
                - task: TerraformInstaller@1
                  displayName: "Install Terraform $(TF_VERSION)"
                  inputs:
                    terraformVersion: $(TF_VERSION)

                - task: TerraformTaskV4@4
                  displayName: "Terraform Init"
                  inputs:
                    provider: azurerm
                    command: init
                    backendServiceArm: "Azure-Service-Connection"
                    backendAzureRmResourceGroupName: $(TF_BACKEND_RG)
                    backendAzureRmStorageAccountName: $(TF_BACKEND_STORAGE)
                    backendAzureRmContainerName: tfstate
                    backendAzureRmKey: "$(TF_ENV).terraform.tfstate"

                - task: TerraformTaskV4@4
                  displayName: "Terraform Apply"
                  inputs:
                    provider: azurerm
                    command: apply
                    environmentServiceNameAzureRM: "Azure-Service-Connection"
                    commandOptions: "-var-file=$(TF_ENV).tfvars -auto-approve"
