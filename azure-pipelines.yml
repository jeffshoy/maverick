trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  - group: terraform-vars
  - name: TF_VERSION
    value: "1.7.0"
  - name: TF_ENV
    value: dev

stages:
  - stage: Plan
    displayName: "Terraform Plan"
    jobs:
      - job: Plan
        displayName: "Init, Validate & Plan"
        steps:
          - script: |
              wget -q -O /tmp/terraform.zip https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip
              unzip -q /tmp/terraform.zip -d /usr/local/bin
              terraform version
            displayName: "Install Terraform $(TF_VERSION)"

          - script: terraform init
            displayName: "Terraform Init"
            workingDirectory: $(System.DefaultWorkingDirectory)
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              ARM_TENANT_ID: $(ARM_TENANT_ID)

          - script: terraform validate
            displayName: "Terraform Validate"
            workingDirectory: $(System.DefaultWorkingDirectory)

          - script: terraform plan -var-file=$(TF_ENV).tfvars
            displayName: "Terraform Plan"
            workingDirectory: $(System.DefaultWorkingDirectory)
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              ARM_TENANT_ID: $(ARM_TENANT_ID)
              AZDO_ORG_SERVICE_URL: $(AZDO_ORG_SERVICE_URL)
              AZDO_PERSONAL_ACCESS_TOKEN: $(AZDO_PERSONAL_ACCESS_TOKEN)

  - stage: Apply
    displayName: "Terraform Apply"
    dependsOn: Plan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: Apply
        displayName: "Apply to $(TF_ENV)"
        environment: $(TF_ENV)
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    wget -q -O /tmp/terraform.zip https://releases.hashicorp.com/terraform/$(TF_VERSION)/terraform_$(TF_VERSION)_linux_amd64.zip
                    unzip -q /tmp/terraform.zip -d /usr/local/bin
                    terraform version
                  displayName: "Install Terraform $(TF_VERSION)"

                - script: terraform init
                  displayName: "Terraform Init"
                  workingDirectory: $(System.DefaultWorkingDirectory)
                  env:
                    ARM_CLIENT_ID: $(ARM_CLIENT_ID)
                    ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
                    ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
                    ARM_TENANT_ID: $(ARM_TENANT_ID)

                - script: terraform apply -var-file=$(TF_ENV).tfvars -auto-approve
                  displayName: "Terraform Apply"
                  workingDirectory: $(System.DefaultWorkingDirectory)
                  env:
                    ARM_CLIENT_ID: $(ARM_CLIENT_ID)
                    ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
                    ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
                    ARM_TENANT_ID: $(ARM_TENANT_ID)
                    AZDO_ORG_SERVICE_URL: $(AZDO_ORG_SERVICE_URL)
                    AZDO_PERSONAL_ACCESS_TOKEN: $(AZDO_PERSONAL_ACCESS_TOKEN)
